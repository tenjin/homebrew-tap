name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch a Homebrew change that breaks a package between releases.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  syntax:
    name: Style and audit
    # Every change to main comes through a pull request, releases included.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          stable: true

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Check the packages this pull request adds or changes
        env:
          BASE_REF: ${{ github.base_ref }}
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" -- 'Casks/*.rb' 'Formula/*.rb')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No package changed."
            exit 0
          fi
          # GoReleaser before v2.19 can only put a cask's postflight_steps at
          # the top, out of stanza order. Drop the exception once the Tenjin
          # CLI releases with v2.19.
          brew style --except-cops=Cask/StanzaOrder "${files[@]}"
          for file in "${files[@]}"; do
            name="$(basename "$file" .rb)"
            case "$file" in
              Casks/*) brew audit --skip-style --strict --online --cask "$TAP/$name" ;;
              Formula/*) brew audit --skip-style --strict --online --formula "$TAP/$name" ;;
            esac
          done

  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          stable: true

      - name: Install and remove every package
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          # A deprecated stanza is an error in developer mode, and only a
          # warning for the people installing.
          HOMEBREW_DEVELOPER: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          shopt -s nullglob
          for file in Casks/*.rb; do
            name="$(basename "$file" .rb)"
            brew install --cask "$TAP/$name"
            brew uninstall --cask "$TAP/$name"
          done
          for file in Formula/*.rb; do
            name="$(basename "$file" .rb)"
            brew install --formula "$TAP/$name"
            brew uninstall --formula "$TAP/$name"
          done
